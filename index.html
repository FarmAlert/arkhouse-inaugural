<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register | Inaugural Service, Ark House Global Ministries</title>
<meta name="description" content="Register for the Inaugural Service of Ark House Global Ministries. Monday, 5 October 2026, 5:00 pm, Arlington Hotel and Suites, Kubwa, Abuja.">
<meta name="theme-color" content="#1c0504">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --night: #1c0504;
    --oxblood: #3a0b08;
    --ember: #b3200f;
    --gold: #f3c659;
    --gold-deep: #c9952a;
    --cream: #fff7e6;
    --paper: #ffffff;
    --text: #2a0907;
    --muted: #7a5f58;
    --soft: #ecd9c6;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: "Figtree", system-ui, sans-serif;
    font-size: 17px;
    line-height: 1.5;
    color: var(--cream);
    background:
      radial-gradient(60% 45% at 28% 62%, rgba(214, 84, 20, 0.55) 0%, rgba(120, 26, 10, 0.25) 45%, transparent 75%),
      radial-gradient(50% 40% at 90% 0%, rgba(120, 20, 12, 0.5) 0%, transparent 70%),
      var(--night);
    background-attachment: fixed;
    min-height: 100vh;
  }
  .page {
    max-width: 1160px;
    margin: 0 auto;
    padding: 40px 32px 56px;
    display: grid;
    grid-template-columns: 1.08fr 0.92fr;
    gap: 56px;
    align-items: start;
  }

  /* ---------- event side ---------- */
  .logo { display: block; height: 62px; width: auto; margin-left: -6px; }
  .tagline {
    margin: 26px 0 10px;
    color: var(--gold);
    font-weight: 600;
    font-size: 1.05rem;
  }
  h1 {
    font-family: "Marcellus", serif;
    font-weight: 400;
    font-size: clamp(3rem, 7.2vw, 5.6rem);
    line-height: 0.96;
    letter-spacing: 0.01em;
    text-transform: uppercase;
    margin: 0;
    background: linear-gradient(180deg, #fffaf0 30%, #f3d9a4 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .theme {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin: 22px 0 0;
    font-family: "Marcellus", serif;
    font-size: 1.45rem;
    color: var(--gold);
  }
  .theme::before, .theme::after {
    content: "";
    width: 34px; height: 1px;
    background: var(--gold);
  }
  .flyer {
    display: block;
    width: 100%;
    max-width: 520px;
    height: auto;
    margin: 30px 0 28px;
    border-radius: 16px;
    box-shadow:
      0 0 0 1px rgba(243, 198, 89, 0.55),
      0 0 0 7px rgba(243, 198, 89, 0.10),
      0 40px 80px -24px rgba(0, 0, 0, 0.8);
  }
  .facts {
    margin: 4px 0 0;
    display: grid;
    grid-template-columns: auto auto 1fr;
    gap: 28px;
  }
  .facts div { border-top: 1px solid rgba(243, 198, 89, 0.7); padding-top: 12px; }
  .facts dt { font-size: 0.85rem; color: #e8c9ae; }
  .facts dd {
    margin: 2px 0 0;
    font-family: "Marcellus", serif;
    font-size: 1.2rem;
    line-height: 1.3;
  }
  .jump { display: none; }

  /* ---------- form side ---------- */
  .card {
    position: sticky;
    top: 32px;
    color: var(--text);
    background: var(--cream);
    border-radius: 20px;
    padding: 40px 38px 34px;
    box-shadow:
      0 0 0 1px rgba(243, 198, 89, 0.55),
      0 0 0 7px rgba(243, 198, 89, 0.10),
      0 40px 80px -20px rgba(0, 0, 0, 0.75);
  }
  h2 {
    font-family: "Marcellus", serif;
    font-weight: 400;
    font-size: 2rem;
    line-height: 1.15;
    margin: 0 0 6px;
  }
  .intro { margin: 0 0 10px; color: var(--muted); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  label { display: block; font-weight: 600; font-size: 0.95rem; margin: 16px 0 6px; }
  .optional, .hint { font-weight: 400; color: var(--muted); }
  .hint { display: block; font-size: 0.86rem; }
  input, select, textarea {
    width: 100%;
    padding: 13px 14px;
    font: inherit;
    color: var(--text);
    background: var(--paper);
    border: 1.5px solid var(--soft);
    border-radius: 10px;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  input::placeholder { color: #b9a59b; }
  textarea { resize: vertical; display: block; }
  input:hover, select:hover, textarea:hover { border-color: var(--gold-deep); }
  input:focus, select:focus, textarea:focus {
    outline: none;
    border-color: var(--gold-deep);
    box-shadow: 0 0 0 4px rgba(243, 198, 89, 0.35);
  }
  /* honeypot field: hidden from people, catches spam bots */
  .hp { position: absolute; left: -9999px; }
  button, .jump {
    width: 100%;
    padding: 16px;
    font: inherit;
    font-weight: 600;
    font-size: 1.05rem;
    color: var(--night);
    background: linear-gradient(180deg, #f9d77c 0%, var(--gold) 45%, var(--gold-deep) 100%);
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 10px 24px -10px rgba(201, 149, 42, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.5);
    transition: transform 0.12s, filter 0.12s;
  }
  button { margin-top: 26px; }
  button:hover { filter: brightness(1.05); transform: translateY(-1px); }
  button:active { transform: translateY(0); }
  button:focus-visible, .jump:focus-visible { outline: 3px solid var(--ember); outline-offset: 3px; }
  button:disabled { opacity: 0.65; cursor: wait; transform: none; }
  .message { margin: 12px 0 0; min-height: 1.5em; }
  .message.error { color: var(--ember); font-weight: 600; }
  .contact { margin: 10px 0 0; font-size: 0.92rem; color: var(--muted); text-align: center; }
  .contact a { color: var(--ember); font-weight: 600; text-decoration: none; }

  .done { text-align: center; padding-top: 48px; padding-bottom: 48px; }
  .seal {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    display: grid; place-items: center;
    background: linear-gradient(180deg, #f9d77c, var(--gold-deep));
    box-shadow: 0 0 0 8px rgba(243, 198, 89, 0.22);
  }
  .done p { margin: 8px 0 0; }

  @media (prefers-reduced-motion: no-preference) {
    .event > * { animation: rise 0.7s ease-out both; }
    .event > *:nth-child(3) { animation-delay: 0.08s; }
    .event > *:nth-child(4) { animation-delay: 0.16s; }
    .card { animation: rise 0.7s 0.2s ease-out both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  }

  @media (max-width: 900px) {
    body { background-attachment: scroll; }
    .page { grid-template-columns: 1fr; gap: 36px; padding: 28px 18px 40px; }
    .event { text-align: center; }
    .logo { margin: 0 auto; height: 54px; }
    .flyer { margin: 26px auto 24px; }
    .facts { grid-template-columns: 1fr 1fr; gap: 18px; text-align: left; }
    .facts div:last-child { grid-column: 1 / -1; }
    .jump {
      display: block;
      margin-top: 24px;
      text-align: center;
      text-decoration: none;
    }
    .card { position: static; padding: 30px 22px 26px; }
    h2 { font-size: 1.7rem; }
  }
  @media (max-width: 400px) { .row { grid-template-columns: 1fr; gap: 0; } }
</style>
</head>

  <section class="card" id="register">
    <h2>Register to attend</h2>
    <p class="intro">It takes less than a minute.</p>
    <form id="regForm" novalidate>
      <div class="row">
        <div>
          <label for="title">Title</label>
          <select id="title" name="title" required>
            <option value="">Select</option>
            <option>Mr.</option>
            <option>Mrs.</option>
            <option>Miss</option>
            <option>Pastor</option>
            <option>Evangelist</option>
            <option>Prophet</option>
            <option>Apostle</option>
            <option>Deacon</option>
            <option>Deaconess</option>
            <option>Dr.</option>
            <option>Other</option>
          </select>
        </div>
        <div>
          <label for="gender">Gender</label>
          <select id="gender" name="gender" required>
            <option value="">Select</option>
            <option>Male</option>
            <option>Female</option>
          </select>
        </div>
      </div>

      <label for="name">Full name</label>
      <input id="name" name="name" type="text" autocomplete="name" required>

      <label for="whatsapp">WhatsApp number</label>
      <input id="whatsapp" name="whatsapp" type="tel" inputmode="tel" autocomplete="tel" placeholder="0802 000 0000" required>

      <label for="email">Email address</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <label for="address">Address <span class="hint">City / State / Country, for example Kubwa / FCT / Nigeria</span></label>
      <input id="address" name="address" type="text" required>

      <!-- SUGGESTED EXTRAS: all four optional. Delete from here to END EXTRAS if not wanted. -->
      <label for="guests">How many people are coming with you? <span class="optional">(optional)</span></label>
      <select id="guests" name="guests">
        <option value="0">Just me</option>
        <option>1</option>
        <option>2</option>
        <option>3</option>
        <option>4</option>
        <option>5 or more</option>
      </select>

      <label for="source">How did you hear about this service? <span class="optional">(optional)</span></label>
      <select id="source" name="source">
        <option value="">Select</option>
        <option>A friend or family member</option>
        <option>WhatsApp</option>
        <option>Facebook</option>
        <option>Instagram</option>
        <option>TikTok</option>
        <option>Flyer</option>
        <option>Other</option>
      </select>
      <label for="updates">Would you like to receive updates from Ark House on WhatsApp? <span class="optional">(optional)</span></label>
      <select id="updates" name="updates">
        <option value="">Select</option>
        <option>Yes</option>
        <option>No</option>
      </select>

      <label for="prayer">Prayer request <span class="optional">(optional)</span></label>
      <textarea id="prayer" name="prayer" rows="3" maxlength="500"></textarea>
      <!-- END EXTRAS -->

      <input class="hp" name="website" type="text" tabindex="-1" autocomplete="off" aria-hidden="true">

      <button type="submit" id="submitBtn">Register</button>
      <p class="message" id="message" role="status"></p>
      <p class="contact">Questions? Call <a href="tel:+2348029647212">0802 964 7212</a></p>
    </form>
  </section>

</main>

<script>
  // PASTE your Google Apps Script web app URL between the quotes (it ends in /exec)
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwayjZE_UR3s8PDX9V0nOk_MLc8u8IUPM7yuxdXkTawWYuieMCEoeH2bBW7tt_j12Cd6g/exec";

  const form = document.getElementById("regForm");
  const btn = document.getElementById("submitBtn");
  const msg = document.getElementById("message");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "message";
    msg.textContent = "";

    if (!form.checkValidity()) {
      msg.className = "message error";
      msg.textContent = "Fill in your title, gender, full name, WhatsApp number, a valid email address and your address.";
      const firstBad = form.querySelector(":invalid");
      if (firstBad) firstBad.focus();
      return;
    }
    if (form.website.value) return; // spam bot filled the hidden field

    btn.disabled = true;
    btn.textContent = "Registering...";

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: new URLSearchParams(new FormData(form))
      });
      const firstName = form.name.value.trim().split(" ")[0];
      const card = document.getElementById("register");
      card.classList.add("done");
      card.innerHTML =
        '<div class="seal"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#1c0504" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
        '<h2></h2><p>See you on Monday, 5 October at 5:00 pm prompt.</p><p>Arlington Hotel and Suites, PW Bakori Road, Kubwa, Abuja.</p>' +
        '<p class="contact">Questions? Call <a href="tel:+2348029647212">0802 964 7212</a></p>';
      card.querySelector("h2").textContent = "You are registered, " + firstName + ".";
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    } catch (err) {
      btn.disabled = false;
      btn.textContent = "Register";
      msg.className = "message error";
      msg.textContent = "Your registration did not go through. Check your connection and try again.";
    }
  });
</script>
